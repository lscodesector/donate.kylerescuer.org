<script>
  (function () {
    var CAMPAIGN_START = "2026-07-10";
    var INITIAL_RAISED = 10;
    var DAILY_MIN = 100;
    var DAILY_MAX = 300;
    var UPDATE_EVERY_DAYS = 1;
    var GOAL = 50000;

    var AVG_TICKET_BASE = 30;
    var TICKET_JITTER_MIN = 0.05;
    var TICKET_JITTER_MAX = 0.2;

    function mulberry32(seed) {
      return function () {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    function rngForDay(dayIndex) {
      return mulberry32(dayIndex);
    }
    function randBetween(rng, min, max) {
      return min + rng() * (max - min);
    }

    function daysElapsed(nowMs) {
      var start = new Date(CAMPAIGN_START + "T00:00:00Z").getTime();
      var diff = Math.floor((nowMs - start) / 86400000);
      return Math.max(0, diff);
    }

    function calcRaised(nowMs) {
      var steps = Math.floor(daysElapsed(nowMs) / UPDATE_EVERY_DAYS);
      var total = INITIAL_RAISED;
      for (var i = 1; i <= steps; i++) {
        total += randBetween(rngForDay(i), DAILY_MIN, DAILY_MAX);
        if (total >= GOAL) {
          total = GOAL;
          break;
        }
      }
      return Math.round(total * 100) / 100;
    }

    function calcSupporters(raised, nowMs) {
      if (raised <= 0) return 0;
      var rng = rngForDay(daysElapsed(nowMs) || 1);
      var sign = rng() < 0.5 ? -1 : 1;
      var jitter = randBetween(rng, TICKET_JITTER_MIN, TICKET_JITTER_MAX);
      var ticket = AVG_TICKET_BASE * (1 + sign * jitter);
      return Math.max(1, Math.round(raised / ticket));
    }

    function formatUSD(value) {
      return (
        "$" +
        value.toLocaleString("en-US", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        })
      );
    }

    function buildConfig(nowMs) {
      var raised = calcRaised(nowMs);
      var supporters = calcSupporters(raised, nowMs);
      var pct = Math.round((raised / GOAL) * 100);
      if (raised > 0 && pct < 1) pct = 1;
      if (pct > 100) pct = 100;

      return {
        raised: formatUSD(raised),
        goal: formatUSD(GOAL),
        goalSticky: "of " + formatUSD(GOAL),
        progressPercent: pct,
        progressLabel: pct + "% of goal reached",
        supporters: String(supporters),
        supportersLabel: supporters + " supporters",
      };
    }

    window.CP_CONFIG = buildConfig(Date.now());

    function refineWithServerTime() {
      var cacheKey = "cp_config_server_time_offset";
      var cachedOffset = null;
      try {
        cachedOffset = sessionStorage.getItem(cacheKey);
      } catch (_) {}

      if (cachedOffset !== null) {
        window.CP_CONFIG = buildConfig(Date.now() + parseInt(cachedOffset, 10));
        if (window.applyCPConfig) window.applyCPConfig();
        return;
      }

      fetch(window.location.origin + "/", { method: "HEAD", cache: "no-store" })
        .then(function (res) {
          var dateHeader = res.headers.get("Date");
          var serverMs = dateHeader
            ? new Date(dateHeader).getTime()
            : Date.now();
          var offset = serverMs - Date.now();
          try {
            sessionStorage.setItem(cacheKey, String(offset));
          } catch (_) {}
          window.CP_CONFIG = buildConfig(Date.now() + offset);
          if (window.applyCPConfig) window.applyCPConfig();
        })
        .catch(function () {});
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", refineWithServerTime);
    } else {
      refineWithServerTime();
    }
  })();
</script>
